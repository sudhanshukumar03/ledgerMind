version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ledgermind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ledgermind
      POSTGRES_PASSWORD: ledgermind
      POSTGRES_DB: ledgermind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgermind -d ledgermind"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ledgermind-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
