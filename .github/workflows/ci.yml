name: CI

# Synthetic regression gates; no external AI/payment calls are required.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Unit specs need no DB/Redis — Prisma is mocked and the throttler
      # fails open when Redis is unreachable. These two are required only
      # because AppModule-adjacent providers read them at construction.
      GROQ_API_KEY: test_key
      # Must be >=32 chars — AppModule's JwtModule factory rejects anything
      # shorter at bootstrap (src/app.module.ts). A throwaway CI value, not a secret.
      JWT_SECRET: ci_test_jwt_secret_minimum_32_chars_long
      NODE_ENV: test
      AI_ENABLED: 'false'
      PAYMENT_EXECUTION_MODE: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: node ../scripts/verify-tooling.cjs
      # --runInBand: ts-jest workers are memory-hungry; parallel workers OOM.
      - run: npm run test:unit -- --runInBand

  backend-e2e:
    name: Backend e2e (webhooks, security)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      TEST_ALLOW_DATABASE_RESET: 'true'
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ledgermind_test
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      GROQ_API_KEY: test_key
      JWT_SECRET: ci_test_jwt_secret_minimum_32_chars_long
      RAZORPAY_WEBHOOK_SECRET: test_secret
      NODE_ENV: test
      AI_ENABLED: 'false'
      PAYMENT_EXECUTION_MODE: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # Docker Hub's unauthenticated pull rate limit is too tight for the
      # services: block, which pulls images outside of any authenticated
      # context. Login first, then start containers manually.
      - name: Authenticate with Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Start PostgreSQL and Redis
        run: |
          docker pull postgres:16-alpine
          docker pull redis:7-alpine

          docker run -d \
            --name ledgermind-postgres \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=ledgermind_test \
            -p 5432:5432 \
            postgres:16-alpine

          docker run -d \
            --name ledgermind-redis \
            -p 6379:6379 \
            redis:7-alpine

      - name: Wait for services
        run: |
          for i in $(seq 1 30); do
            if docker exec ledgermind-postgres pg_isready -h 127.0.0.1 -U postgres 2>/dev/null; then break; fi
            sleep 1
          done

          for i in $(seq 1 30); do
            if docker exec ledgermind-redis redis-cli ping 2>/dev/null | grep -q PONG; then break; fi
            sleep 1
          done

          docker exec ledgermind-postgres pg_isready -h 127.0.0.1 -U postgres
          docker exec ledgermind-redis redis-cli ping

      - run: npm ci
      - run: npx prisma generate
      # No migrations dir — push the schema straight onto the fresh test DB.
      - run: npx prisma db push --skip-generate
      # --forceExit: the app opens BullMQ/Redis + Prisma handles that the specs
      # don't tear down; without it Jest hangs after the last test and the job
      # would run until timeout. --runInBand for the same OOM reason as unit.
      - run: npm run test:e2e -- --runInBand --forceExit
      - run: npm run build
      - name: Quality follow-up acceptance (Q1-Q5)
        run: node ../scripts/review-quality.mjs

      - name: Cleanup containers
        if: always()
        run: |
          docker rm -f ledgermind-postgres ledgermind-redis 2>/dev/null || true

  frontend-build:
    name: Frontend build and browser regressions
    runs-on: ubuntu-latest
    strategy:
      matrix:
        api-prefix: ['/api', '/api/v1']
    env:
      NEXT_PUBLIC_API_URL: ${{ matrix.api-prefix }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Prepare standalone browser server
        run: |
          cp -r .next/static .next/standalone/frontend/.next/
          cp -r public .next/standalone/frontend/
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=1 --reporter=line
      - name: Offline contracts and documentation
        working-directory: .
        run: |
          node scripts/verify-contracts.cjs
          python scripts/check_docs.py
