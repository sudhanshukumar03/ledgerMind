name: CI

# WS4 CI gate (see docs/17-HARDENING-ROADMAP.md).
# Runs backend unit + e2e and the frontend build on every PR to main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Unit specs need no DB/Redis — Prisma is mocked and the throttler
      # fails open when Redis is unreachable. These two are required only
      # because AppModule-adjacent providers read them at construction.
      GROQ_API_KEY: test_key
      # Must be >=32 chars — AppModule's JwtModule factory rejects anything
      # shorter at bootstrap (src/app.module.ts). A throwaway CI value, not a secret.
      JWT_SECRET: ci_test_jwt_secret_minimum_32_chars_long
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      # --runInBand: ts-jest workers are memory-hungry; parallel workers OOM.
      - run: npm run test:unit -- --runInBand

  backend-e2e:
    name: Backend e2e (webhooks, security)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ledgermind_test
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      GROQ_API_KEY: test_key
      JWT_SECRET: ci_test_jwt_secret_minimum_32_chars_long
      RAZORPAY_WEBHOOK_SECRET: test_secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Start PostgreSQL and Redis
        run: |
          docker pull public.ecr.aws/docker/library/postgres:16-alpine
          docker pull ghcr.io/valkey-io/valkey:7.2-alpine

          docker run -d \
            --name ledgermind-postgres \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=ledgermind_test \
            -p 5432:5432 \
            public.ecr.aws/docker/library/postgres:16-alpine

          docker run -d \
            --name ledgermind-redis \
            -p 6379:6379 \
            ghcr.io/valkey-io/valkey:7.2-alpine

      - name: Wait for services
        run: |
          for i in $(seq 1 30); do
            if docker exec ledgermind-postgres pg_isready -U postgres 2>/dev/null; then break; fi
            sleep 1
          done

          for i in $(seq 1 30); do
            if docker exec ledgermind-redis redis-cli ping 2>/dev/null | grep -q PONG; then break; fi
            sleep 1
          done

          docker exec ledgermind-postgres pg_isready -U postgres
          docker exec ledgermind-redis redis-cli ping

      - run: npm ci
      - run: npx prisma generate
      # No migrations dir — push the schema straight onto the fresh test DB.
      - run: npx prisma db push --skip-generate
      # --forceExit: the app opens BullMQ/Redis + Prisma handles that the specs
      # don't tear down; without it Jest hangs after the last test and the job
      # would run until timeout. --runInBand for the same OOM reason as unit.
      - run: npm run test:e2e -- --runInBand --forceExit

      - name: Cleanup containers
        if: always()
        run: |
          docker rm -f ledgermind-postgres ledgermind-redis 2>/dev/null || true

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # TODO (WS4): full-stack Playwright e2e. The frontend specs
  # (e2e/dashboard, e2e/exceptions, + transactions once written) need the
  # Next.js app AND the NestJS API AND a seeded Postgres running together.
  # Wiring that orchestration is a follow-up — tracked in
  # docs/17-HARDENING-ROADMAP.md WS4, not part of this first cut.
